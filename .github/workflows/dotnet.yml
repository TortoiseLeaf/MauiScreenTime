# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build .NET MAUI App

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    # Cache NuGet packages 
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
  
    # - name: Cache MAUI workloads
    #   uses: actions/cache@v4
    #   id: maui-cache
    #   with:
    #     path: |
    #       C:\Program Files\dotnet\sdk-manifests
    #       C:\Program Files\dotnet\packs
    #       C:\Program Files\dotnet\library-packs
    #       C:\Program Files\dotnet\template-packs
    #     key: ${{ runner.os }}-maui-9.0-${{ hashFiles('**/*.csproj') }}
    #     restore-keys: |
    #       ${{ runner.os }}-maui-9.0-
    
    - name: Install .NET MAUI
    # check cache
      if: steps.maui-cache.outputs.cache-hit != 'true'
      run: dotnet workload install maui
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build MauiScreenTime.csproj -c Release -f net9.0-android --no-restore
    
    - name: Test
      if: hashFiles('**/*Tests.csproj') != ''
      run: dotnet test --no-build --verbosity normal -c Release
