# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build .NET MAUI App

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    # Cache NuGet packages 
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Install .NET MAUI
    # check cache
      if: steps.maui-cache.outputs.cache-hit != 'true'
      run: dotnet workload install maui
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build src/MauiScreenTime/MauiScreenTime.csproj -c Release -f net9.0-android --no-restore

    # - name: Run unit tests with report
    #   run: dotnet test /MauiScreenTimeTests/MauiScreenTimeTests.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"

    - name: Test 
      if: hashFiles('**test/MauiScreenTimeTests/MauiScreenTimeTests.csproj') != ''
      run: dotnet --no-build --verbosity normal -c Release
