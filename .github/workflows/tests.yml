name: Test Only

on:
  workflow_dispatch:
  push:
    branches: [ "dev" ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore test/MauiScreenTimeTests/MauiScreenTimeTests.csproj
    
    - name: Build test project
      run: dotnet build test/MauiScreenTimeTests/MauiScreenTimeTests.csproj --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test test/MauiScreenTimeTests/MauiScreenTimeTests.csproj --configuration Release --no-build --verbosity detailed